spring.application.name=employee-management-system
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:supersecretkey12345678910jwtsecretkey0987654321supersecretkey0}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.name=Employee Management System
app.version=1.0.0
app.description=Backend service for managing employees and departments.

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=false

logging.pattern.level=%5p [corr:%X{correlationId:-N/A}]
