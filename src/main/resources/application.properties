spring.application.name=employee-management-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:supersecretkey12345678910jwtsecretkey0987654321supersecretkey0}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.name=Employee Management System
app.version=1.0.0
app.description=Backend service for managing employees and departments.

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=false

logging.level.com.example.employeemanagement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.level=%5p [corr:%X{correlationId:-N/A}]
