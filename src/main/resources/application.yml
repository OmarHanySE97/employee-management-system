spring:
  application:
    name: employee-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:supersecretkey12345678910jwtsecretkey0987654321supersecretkey0}
  expiration: ${JWT_EXPIRATION:3600000}

app:
  name: Employee Management System
  version: 1.0.0
  description: Production-ready backend service for employee and department management

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: false

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-N/A}]"
